<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Royal Match Clone - Professional Fix</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#1a1a2e,#16213e);min-height:100vh;display:flex;flex-direction:column;align-items:center;font-family:'Segoe UI',sans-serif;color:#fff;overflow:hidden;touch-action:none}
#header{width:100%;max-width:420px;padding:15px;display:flex;justify-content:space-between;gap:10px}
#header div{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border-radius:15px;padding:10px;flex:1;text-align:center;border:1px solid rgba(255,255,255,.1)}
.label{font-size:10px;opacity:.7;text-transform:uppercase}
.value{font-size:22px;font-weight:800;color:#ffd700}
#board-wrap{position:relative;padding:10px;background:rgba(0,0,0,.3);border-radius:20px;margin-top:10px}
canvas{display:block;border-radius:10px;cursor:pointer}
#objectives{width:100%;max-width:420px;display:flex;gap:10px;padding:10px;justify-content:center}
.obj{background:rgba(255,255,255,0.15);padding:8px 15px;border-radius:20px;font-weight:bold;display:flex;align-items:center;gap:8px}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:50px;font-weight:900;z-index:100;transition:0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);text-shadow:0 0 20px rgba(0,0,0,0.5)}
#msg.show{transform:translate(-50%,-50%) scale(1)}
#lvl-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:1000}
#lvl-modal.hidden{display:none}
.modal-content{background:#1a1a2e;padding:40px;border-radius:30px;text-align:center;border:2px solid #ffd700}
button{background:linear-gradient(to bottom,#ffd700,#ffa500);border:none;padding:15px 40px;border-radius:30px;font-size:20px;font-weight:bold;cursor:pointer;margin-top:20px;box-shadow:0 5px 15px rgba(255,165,0,0.4)}
</style>
</head>
<body>

<div id="header">
    <div><div class="label">レベル</div><div class="value" id="lvl">1</div></div>
    <div><div class="label">手数</div><div class="value" id="moves">20</div></div>
    <div><div class="label">スコア</div><div class="value" id="score">0</div></div>
</div>

<div id="objectives"></div>

<div id="board-wrap">
    <canvas id="c"></canvas>
</div>

<div id="msg"></div>
<div id="lvl-modal"><div class="modal-content"><h2 id="m-title">レベル 1</h2><p>目標を達成しよう！</p><button onclick="startLevel()">スタート</button></div></div>

<script>
/** 設定・変数 **/
const COLS=8, ROWS=8, TYPES=5, ANIM_MS=200;
const COLORS=['#FF3B30','#FFCC00','#4CD964','#5AC8FA','#AF52DE']; // 赤, 黄, 緑, 青, 紫
const TYPE_CRATE=100;
const OBJ_ICONS = { 100: '📦', 0: '🔴', 1: '🟡', 2: '🟢', 3: '🔵', 4: '🟣' };

let canvas, ctx, cellSz;
let board=[], objectives=[], moves=20, score=0, level=1;
let animating=false, sel=null, dragStart=null;

/** 初期化 **/
function init() {
    canvas = document.getElementById('c');
    ctx = canvas.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', () => dragStart = null);
    showLevelModal();
    loop();
}

function resize() {
    let w = Math.min(window.innerWidth - 40, 420);
    cellSz = Math.floor(w / COLS);
    canvas.width = cellSz * COLS;
    canvas.height = cellSz * ROWS;
}

/** ボード生成（障害物強化） **/
function makeBoard() {
    board = [];
    for(let r=0; r<ROWS; r++) {
        board[r] = [];
        for(let c=0; c<COLS; c++) {
            board[r][c] = { type: rndType(r,c), x: c*cellSz, y: r*cellSz, ty: r*cellSz, scale: 1, alpha: 1, special: null };
        }
    }
    // 障害物（木箱）をレベルに応じて配置
    let crateCount = 4 + (level * 2); 
    let placed = 0;
    while(placed < crateCount) {
        let r = Math.floor(Math.random()*(ROWS-2))+2; // 下の方に配置
        let c = Math.floor(Math.random()*COLS);
        if(board[r][c].type < 100) {
            board[r][c].type = TYPE_CRATE;
            placed++;
        }
    }
}

function rndType(r,c) {
    let t;
    do { t = Math.floor(Math.random()*TYPES); }
    while((c>1 && board[r][c-1].type===t && board[r][c-2].type===t) || (r>1 && board[r-1][c].type===t && board[r-2][c].type===t));
    return t;
}

/** 描画 **/
function loop() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawGrid();
    for(let r=0; r<ROWS; r++) {
        for(let c=0; c<COLS; c++) {
            let g = board[r][c];
            if(!g) continue;
            ctx.save();
            ctx.translate(g.x + cellSz/2, g.y + cellSz/2);
            ctx.scale(g.scale, g.scale);
            ctx.globalAlpha = g.alpha;
            
            if(g.type === TYPE_CRATE) drawCrate();
            else if(g.special) drawSpecial(g.special);
            else drawGem(g.type);

            if(sel && sel.r===r && sel.c===c) {
                ctx.strokeStyle = "white"; ctx.lineWidth = 4; ctx.strokeRect(-cellSz/2+4, -cellSz/2+4, cellSz-8, cellSz-8);
            }
            ctx.restore();
        }
    }
    requestAnimationFrame(loop);
}

function drawGrid() {
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) {
        ctx.fillStyle = (r+c)%2===0 ? "rgba(255,255,255,0.05)" : "rgba(0,0,0,0.1)";
        ctx.fillRect(c*cellSz, r*cellSz, cellSz, cellSz);
    }
}

function drawGem(t) {
    ctx.fillStyle = COLORS[t];
    ctx.beginPath(); ctx.arc(0,0, cellSz*0.35, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth=2; ctx.stroke();
}

function drawCrate() {
    ctx.fillStyle = "#8B4513"; ctx.fillRect(-cellSz*0.4, -cellSz*0.4, cellSz*0.8, cellSz*0.8);
    ctx.strokeStyle = "#442200"; ctx.lineWidth=2; ctx.strokeRect(-cellSz*0.4, -cellSz*0.4, cellSz*0.8, cellSz*0.8);
    ctx.beginPath(); ctx.moveTo(-cellSz*0.4,-cellSz*0.4); ctx.lineTo(cellSz*0.4, cellSz*0.4); ctx.stroke();
}

function drawSpecial(s) {
    ctx.fillStyle = "#FFD700";
    ctx.beginPath(); ctx.arc(0,0, cellSz*0.4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#000"; ctx.font = "bold 20px serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    let icon = s==='rocket_h'?'↔':s==='rocket_v'?'↕':s==='bomb'?'💣':'🚁';
    ctx.fillText(icon, 0, 0);
}

/** 入力処理 **/
function onDown(e) {
    if(animating) return;
    let rect = canvas.getBoundingClientRect();
    let c = Math.floor((e.clientX - rect.left)/cellSz), r = Math.floor((e.clientY - rect.top)/cellSz);
    if(r<0||r>=ROWS||c<0||c>=COLS) return;
    
    if(sel) {
        if(Math.abs(sel.r-r) + Math.abs(sel.c-c) === 1) { trySwap(sel.r, sel.c, r, c); sel=null; return; }
    }
    sel = {r,c}; dragStart = {r,c,x:e.clientX,y:e.clientY};
}

function onMove(e) {
    if(!dragStart || animating) return;
    let dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
    if(Math.sqrt(dx*dx+dy*dy) > 20) {
        let nr = dragStart.r, nc = dragStart.c;
        if(Math.abs(dx) > Math.abs(dy)) nc += dx > 0 ? 1 : -1;
        else nr += dy > 0 ? 1 : -1;
        if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS) trySwap(dragStart.r, dragStart.c, nr, nc);
        dragStart = null; sel = null;
    }
}

/** ロジック核心 **/
async function trySwap(r1,c1,r2,c2) {
    animating = true;
    let g1 = board[r1][c1], g2 = board[r2][c2];
    if(!g1 || !g2 || g1.type >= 100 || g2.type >= 100) { animating=false; return; }

    // アニメーション
    await Promise.all([animateMove(g1, r2, c2), animateMove(g2, r1, c1)]);
    board[r1][c1] = g2; board[r2][c2] = g1;

    let matches = findMatches();
    let isSpecialSwap = g1.special || g2.special;

    if(matches.length > 0 || isSpecialSwap) {
        moves--;
        if(isSpecialSwap) {
            // 特殊アイテム発動（交換された両方の位置を消去対象に含める）
            let targets = [];
            if(g1.special) targets = targets.concat(getSpecialTargets(r2, c2, g1.special));
            if(g2.special) targets = targets.concat(getSpecialTargets(r1, c1, g2.special));
            targets.push({r:r1, c:c1}, {r:r2, c:c2}); // ★ここが重要：自分自身を消去
            await processRemoval(targets);
        } else {
            await processMatches(matches);
        }
    } else {
        // マッチしないなら戻す
        await Promise.all([animateMove(g1, r1, c1), animateMove(g2, r2, c2)]);
        board[r1][c1] = g1; board[r2][c2] = g2;
    }
    animating = false;
    checkWin();
}

function findMatches() {
    let matched = new Set();
    // 横
    for(let r=0; r<ROWS; r++) {
        for(let c=0; c<COLS-2; c++) {
            let t = board[r][c].type; if(t>=100) continue;
            if(board[r][c+1].type===t && board[r][c+2].type===t) {
                matched.add(`${r},${c}`); matched.add(`${r},${c+1}`); matched.add(`${r},${c+2}`);
            }
        }
    }
    // 縦
    for(let c=0; c<COLS; c++) {
        for(let r=0; r<ROWS-2; r++) {
            let t = board[r][c].type; if(t>=100) continue;
            if(board[r+1][c].type===t && board[r+2][c].type===t) {
                matched.add(`${r},${c}`); matched.add(`${r+1},${c}`); matched.add(`${r+2},${c}`);
            }
        }
    }
    // ★正方形判定 (2x2) -> Drone用
    for(let r=0; r<ROWS-1; r++) {
        for(let c=0; c<COLS-1; c++) {
            let t = board[r][c].type; if(t>=100) continue;
            if(board[r+1][c].type===t && board[r][c+1].type===t && board[r+1][c+1].type===t) {
                matched.add(`${r},${c}`); matched.add(`${r+1},${c}`); matched.add(`${r},${c+1}`); matched.add(`${r+1},${c+1}`);
            }
        }
    }
    return Array.from(matched).map(s => { let [r,c] = s.split(',').map(Number); return {r,c}; });
}

function findSpecials(matches) {
    // マッチした塊を調べて、特殊アイテムを生成する位置を返す
    let res = [];
    let counts = {};
    matches.forEach(m => {
        let t = board[m.r][m.c].type;
        let key = `${m.r},${m.c}`;
        // 簡易的に：4個以上ならロケット、正方形ならドローン
        // 本来はもっと複雑な判定が必要ですが、ここでは2x2があればドローンを優先
    });
    
    // 正方形チェック（ドローン生成）
    for(let r=0; r<ROWS-1; r++) {
        for(let c=0; c<COLS-1; c++) {
            let t = board[r][c].type;
            if(matches.some(m=>m.r===r&&m.c===c) &&
               board[r+1][c].type===t && board[r][c+1].type===t && board[r+1][c+1].type===t) {
                res.push({r, c, type: 'drone'});
                return res; // 1つ見つけたら返す
            }
        }
    }
    // 4連チェック（ロケット）
    if(matches.length >= 4) {
        res.push({r: matches[0].r, c: matches[0].c, type: 'rocket_h'});
    }
    return res;
}

async function processMatches(matches) {
    let specials = findSpecials(matches);
    await processRemoval(matches);
    
    // 特殊アイテム生成
    specials.forEach(s => {
        board[s.r][s.c] = { type: -1, special: s.type, x: s.c*cellSz, y: s.r*cellSz, ty: s.r*cellSz, scale: 1, alpha: 1 };
    });

    await dropAndFill();
}

async function processRemoval(targets) {
    // ダメージ処理
    targets.forEach(t => {
        let g = board[t.r]?.[t.c];
        if(!g) return;
        // 隣接する木箱にダメージ
        [[-1,0],[1,0],[0,-1],[0,1]].forEach(d => {
            let nr = t.r+d[0], nc = t.c+d[1];
            if(board[nr]?.[nc]?.type === TYPE_CRATE) {
                updateObj(TYPE_CRATE);
                board[nr][nc] = null;
            }
        });
        if(g.type < 100) updateObj(g.type);
        board[t.r][t.c] = null;
    });

    await new Promise(res => setTimeout(res, 100)); // 消去待機
    await dropAndFill();
    
    let nextMatches = findMatches();
    if(nextMatches.length > 0) await processMatches(nextMatches);
}

function getSpecialTargets(r, c, sp) {
    let t = [];
    if(sp === 'rocket_h') for(let i=0; i<COLS; i++) t.push({r, c: i});
    if(sp === 'rocket_v') for(let i=0; i<ROWS; i++) t.push({r: i, c});
    if(sp === 'bomb') {
        for(let dr=-1; dr<=1; dr++) for(let dc=-1; dc<=1; dc++) {
            if(r+dr>=0 && r+dr<ROWS && c+dc>=0 && c+dc<COLS) t.push({r:r+dr, c:c+dc});
        }
    }
    if(sp === 'drone') {
        // ランダムな目標へ
        let targets = [];
        board.flat().forEach((g, idx) => { if(g && g.type === TYPE_CRATE) targets.push({r: Math.floor(idx/COLS), c: idx%COLS}); });
        if(targets.length > 0) t.push(targets[Math.floor(Math.random()*targets.length)]);
    }
    return t;
}

async function dropAndFill() {
    // 落下
    for(let c=0; c<COLS; c++) {
        let empty = 0;
        for(let r=ROWS-1; r>=0; r--) {
            if(!board[r][c]) empty++;
            else if(empty > 0 && board[r][c].type < 100) {
                board[r+empty][c] = board[r][c];
                board[r][c] = null;
                animateMove(board[r+empty][c], r+empty, c);
            }
        }
    }
    // 補充
    for(let c=0; c<COLS; c++) {
        for(let r=0; r<ROWS; r++) {
            if(!board[r][c]) {
                board[r][c] = { type: rndType(r,c), x: c*cellSz, y: -cellSz, ty: r*cellSz, scale: 1, alpha: 1, special: null };
                animateMove(board[r][c], r, c);
            }
        }
    }
    updUI();
    await new Promise(res => setTimeout(res, ANIM_MS));
}

function animateMove(obj, r, c) {
    obj.ty = r * cellSz;
    return new Promise(res => {
        let start = performance.now();
        let startY = obj.y, startX = obj.x;
        let destY = r * cellSz, destX = c * cellSz;
        function step(now) {
            let p = Math.min((now - start) / ANIM_MS, 1);
            obj.y = startY + (destY - startY) * p;
            obj.x = startX + (destX - startX) * p;
            if(p < 1) requestAnimationFrame(step); else res();
        }
        requestAnimationFrame(step);
    });
}

/** UI・進行管理 **/
function updateObj(type) {
    objectives.forEach(o => { if(o.type === type && o.cur < o.need) { o.cur++; score += 10; } });
}

function updUI() {
    document.getElementById('lvl').textContent = level;
    document.getElementById('moves').textContent = moves;
    document.getElementById('score').textContent = score;
    document.getElementById('objectives').innerHTML = objectives.map(o => `<div class="obj">${OBJ_ICONS[o.type]} ${o.cur}/${o.need}</div>`).join('');
}

function showLevelModal() {
    document.getElementById('lvl-modal').classList.remove('hidden');
    document.getElementById('m-title').textContent = `レベル ${level}`;
    makeBoard();
    objectives = [
        { type: TYPE_CRATE, need: 5 + level, cur: 0 },
        { type: Math.floor(Math.random()*TYPES), need: 15, cur: 0 }
    ];
    updUI();
}

function startLevel() {
    document.getElementById('lvl-modal').classList.add('hidden');
    moves = 25; score = 0; updUI();
}

function checkWin() {
    if(objectives.every(o => o.cur >= o.need)) { showMsg("CLEAR!"); level++; setTimeout(showLevelModal, 1500); }
    else if(moves <= 0) { showMsg("GAME OVER"); setTimeout(showLevelModal, 1500); }
}

function showMsg(t) {
    let m = document.getElementById('msg'); m.textContent = t; m.classList.add('show');
    setTimeout(() => m.classList.remove('show'), 1500);
}

init();
</script>
</body>
</html>
